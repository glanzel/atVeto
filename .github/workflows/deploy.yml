name: Deploy to GitHub Pages

# Baut die App mit der Ziel-Domain als CLIENT_ORIGIN und deployt dist/ auf
# GitHub Pages. CLIENT_ORIGIN bestimmt client_id + redirect_uri in
# dist/client-metadata.json – muss exakt die öffentliche URL der App sein.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: CLIENT_ORIGIN=https://atveto.epock.de npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

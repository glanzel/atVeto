<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title">atVeto – zweiter Rotation Key für deine did:plc</title>
    <meta
      name="description"
      content="Erzeugt einen zweiten ATProto-Rotation-Key im Browser und hinterlegt ihn mit höchster Priorität über dein PDS. Keine Speicherung, kein Server."
    />
  </head>
  <body>
    <main id="app">
      <div class="topbar">
        <button id="lang-switch" class="link" type="button">English</button>
      </div>

      <h1>atVeto</h1>
      <p class="tagline" data-i18n="tagline"></p>

      <!-- Step 1: Handle -->
      <section id="step-handle">
        <div id="test-mode-banner" class="note" hidden></div>
        <form id="handle-form">
          <label for="handle-input" data-i18n="handle.label"></label>
          <div class="row">
            <input
              id="handle-input"
              type="text"
              placeholder="z.B. name.bsky.social"
              autocomplete="off"
              spellcheck="false"
              required
            />
            <button type="submit" id="handle-submit" data-i18n="handle.submit"></button>
          </div>
        </form>
      </section>

      <!-- Step 2: OAuth redirect notice -->
      <section id="step-redirect" hidden>
        <div class="status">
          <span class="spinner"></span>
          <span id="redirect-status" data-i18n="redirect.resolving"></span>
        </div>
      </section>

      <!-- Step 3: Token + key -->
      <section id="step-token" hidden>
        <h2 data-i18n="token.title"></h2>
        <div id="token-request-status" class="status">
          <span class="spinner"></span>
          <span data-i18n="token.requesting"></span>
        </div>

        <div id="token-requested" hidden>
          <p class="note" data-i18n="token.requestedNote"></p>
          <form id="token-form">
            <label for="token-input" data-i18n="token.label"></label>
            <div class="row">
              <input
                id="token-input"
                type="text"
                autocomplete="off"
                spellcheck="false"
                required
              />
              <button type="submit" id="token-submit" data-i18n="token.submit"></button>
            </div>
          </form>
          <p class="note">
            <span data-i18n="token.regenPrefix"></span>
            <button id="regen-token" class="link" type="button" data-i18n="token.regen"></button>
          </p>
        </div>

        <div id="key-preview" hidden>
          <h3 data-i18n="key.newTitle"></h3>
          <p class="mono" id="new-didkey"></p>

          <h3 data-i18n="key.listTitle"></h3>
          <ol id="rotationkey-list" class="keys"></ol>
          <p class="note" data-i18n="key.note"></p>
        </div>
      </section>

      <!-- Step 4: success -->
      <section id="step-done" hidden>
        <h2 data-i18n="done.title"></h2>
        <p class="success" data-i18n="done.success"></p>
        <pre id="verify-json" class="mono"></pre>

        <h3 data-i18n="done.saveTitle"></h3>
        <p class="warning" data-i18n="done.warning"></p>
        <button id="download-key" type="button" data-i18n="done.download"></button>
        <p class="note" data-i18n="done.close"></p>
      </section>

      <!-- did:web fallback -->
      <section id="step-didweb" hidden>
        <h2><span data-i18n="didweb.title"></span> <span class="mono" id="didweb-did"></span></h2>
        <p data-i18n="didweb.body"></p>
        <p class="note" data-i18n="didweb.note"></p>
        <pre id="didweb-doc" class="mono"></pre>
        <button id="download-didweb-key" type="button" data-i18n="didweb.downloadKey"></button>
        <button id="download-didweb-doc" type="button" data-i18n="didweb.downloadDoc"></button>
      </section>

      <div id="error-box" class="error" hidden></div>

      <footer>
        <p class="fineprint" data-i18n="footer.privacy"></p>
        <p class="fineprint">
          <a href="https://github.com/glanzel/atVeto" target="_blank" rel="noopener"
            ><span data-i18n="footer.source"></span> · github.com/glanzel/atVeto</a
          >
        </p>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
